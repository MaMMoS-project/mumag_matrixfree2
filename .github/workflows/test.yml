name: Test package

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

env:
  PYTEST_ADDOPTS: "--color=yes"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup Pixi
      uses: prefix-dev/setup-pixi@v0.9.4
    - name: Build Python distributions
      run: pixi run -e build build-package
    - name: Verify portable macOS wheel outside checkout
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        set -euo pipefail
        wheels=(dist/*-py3-none-any.whl)
        if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" ]]; then
          echo "Expected exactly one dist/*-py3-none-any.whl artifact" >&2
          exit 1
        fi
        wheel_path="$(cd "$(dirname "${wheels[0]}")" && pwd)/$(basename "${wheels[0]}")"
        portable_root="$(mktemp -d "${TMPDIR:-/tmp}/tommos-portable-install.XXXXXX")"
        portable_env="${portable_root}/venv"
        pixi run -e test python -m venv "${portable_env}"
        "${portable_env}/bin/python" -m pip install "${wheel_path}" pytest
        isolated_cwd="$(mktemp -d "${TMPDIR:-/tmp}/tommos-portable-cwd.XXXXXX")"
        cd "${isolated_cwd}"
        unset PYTHONPATH MKLROOT LD_LIBRARY_PATH
        TOMMOS_VERIFY_PORTABLE_INSTALL=1 \
          TOMMOS_WHEEL_PATH="${wheel_path}" \
          TOMMOS_CHECKOUT_PATH="${GITHUB_WORKSPACE}" \
          "${portable_env}/bin/python" -m pytest -q \
          "${GITHUB_WORKSPACE}/tests/test_wheel_install.py" \
          -k macos_wheel_is_portable_and_runs_outside_checkout
    - name: Run tests
      run: pixi run -e test test
    - name: Run example
      run: pixi run -e sample sample
    # for later: standardised task names
    # - name: unit tests
    #   run: pixi run test-unittest
    # - name: doc tests
    #   run: pixi run test-docstrings
    # - name: Test examples
    #   run: pixi run test-notebooks
    - name: Keep pixi.lock artifact for debugging
      uses: actions/upload-artifact@v4
      with:
        path: pixi.lock
      if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
